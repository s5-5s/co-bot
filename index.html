<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <title>co-bot</title>
    <link rel="stylesheet" href="./css/index.css">
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three.min.js",
          "three/addons/loaders/GLTFLoader.js": "./vendor/three.min.js",
          "three/addons/controls/OrbitControls.js": "./vendor/three.min.js"
        }
      }
    </script>
    <script type="module" src="./js/index.js"></script>
  </head>
  <body>
    <div class="model-view"></div>
    <div class="base-layout">
      <div class="data-out">
        <div id="joints-out" class="joints-out">
          <div><span class="data-name">current-x: </span><span id="current-x" class="data-value">0.000</span></div>
          <div><span class="data-name">current-y: </span><span id="current-y" class="data-value">0.000</span></div>
          <div><span class="data-name">current-z: </span><span id="current-z" class="data-value">0.000</span></div>
          <div id="joint-values"></div>
        </div>
      </div>

      <div class="data-in">
        <div class="target-in">
          <div class="tcp-modes" role="tablist" aria-label="TCP mode">
            <button type="button" class="tcp-mode is-active" data-mode="base">TCP BASE</button>
            <button type="button" class="tcp-mode" data-mode="tool">TCP TOOL</button>
            <button type="button" class="tcp-mode" data-mode="target">TCP TARGET</button>
          </div>

          <div id="tcp-jog" class="tcp-panel">
            <div class="target-readout">
              <div><span class="data-name">target-x: </span><output id="target-value-x" class="data-value">0.000</output></div>
              <div><span class="data-name">target-y: </span><output id="target-value-y" class="data-value">0.000</output></div>
              <div><span class="data-name">target-z: </span><output id="target-value-z" class="data-value">0.000</output></div>
            </div>

            <div id="tcp-xy" class="tcp-xy" role="application" aria-label="TCP X Y jog">
              <div class="tcp-xy-axis tcp-xy-axis-x"></div>
              <div class="tcp-xy-axis tcp-xy-axis-y"></div>
              <div class="tcp-xy-thumb"></div>
            </div>

            <label class="tcp-z" for="tcp-z">
              <span class="data-name">z: </span><output id="tcp-z-value" class="data-value">0.00</output>
              <input type="range" id="tcp-z" min="-1" max="1" step="0.01" value="0">
            </label>
          </div>

          <div id="tcp-target" class="tcp-panel" hidden>
            <label for="target-x"><span class="data-name">target-x: </span><input id="target-x" inputmode="decimal"></label>
            <label for="target-y"><span class="data-name">target-y: </span><input id="target-y" inputmode="decimal"></label>
            <label for="target-z"><span class="data-name">target-z: </span><input id="target-z" inputmode="decimal"></label>
            <button type="button" id="target-ok">ок</button>
          </div>

          <button type="button" id="target-reset">сброс</button>
        </div>
      </div>
    </div>
  </body>
</html>
